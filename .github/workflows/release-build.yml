name: Release Build CI

on:
  push:
    tags:
      # Version tags: v1.2.3. The insider channel uses v1.2.3.i and keeps its own workflow.
      - "v*"
      - "!v*.i"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.1

      - name: Cache Android SDK
        uses: actions/cache@v5
        with:
          path: |
            ~/.android
            $ANDROID_HOME
          key: android-sdk-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: wrapper
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_KEY }}

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > app/release.keystore

      # The tag is the single source of truth for the version. Its number is resolved once here and
      # handed to Gradle, so the package, the manifest and the release can never disagree about it.
      - name: Resolve the version code
        run: |
          set -euo pipefail
          VC=$(python3 scripts/gen_update_json.py --tag "${GITHUB_REF_NAME}" --print-version-code)
          echo "versionCode=$VC"
          echo "VC=$VC" >> "$GITHUB_ENV"

      # The tag itself drives the version name, so it does not depend on which tag `git describe`
      # happens to pick (the canary workflow moves a `latest` tag around).
      - name: Build Release APKs
        run: ./gradlew assembleRelease -PversionName="${GITHUB_REF_NAME#v}" -PversionCode="$VC"
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Collect APKs
        run: |
          set -euo pipefail
          OUT=app/build/outputs/apk/release
          TAG="${GITHUB_REF_NAME}"
          mkdir -p release-apks
          cp "$OUT/app-arm64-v8a-release.apk"   "release-apks/moxia-${TAG}-arm64-v8a.apk"
          cp "$OUT/app-armeabi-v7a-release.apk" "release-apks/moxia-${TAG}-armeabi-v7a.apk"
          cp "$OUT/app-universal-release.apk"   "release-apks/moxia-${TAG}-universal.apk"
          ls -lh release-apks

      # versionCode in the manifest must be the one baked into the APKs, so read it back from the
      # built package instead of recomputing the tag rule a second time.
      - name: Verify the built version matches the tag
        run: |
          set -euo pipefail
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -n 1)
          LINE=$("$AAPT2" dump badging release-apks/moxia-${GITHUB_REF_NAME}-arm64-v8a.apk | head -n 1)
          CODE=$(echo "$LINE" | sed -E "s/.*versionCode='([0-9]+)'.*/\1/")
          NAME=$(echo "$LINE" | sed -E "s/.*versionName='([^']+)'.*/\1/")
          echo "built versionCode=$CODE versionName=$NAME"
          test "$NAME" = "${GITHUB_REF_NAME#v}" || { echo "versionName does not match the tag"; exit 1; }
          test "$CODE" = "$VC" || { echo "versionCode $CODE does not match the tag version code $VC"; exit 1; }

      - name: Generate update.json
        run: |
          set -euo pipefail
          python3 scripts/gen_update_json.py \
            --tag "${GITHUB_REF_NAME}" \
            --apk-dir release-apks \
            --base-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}" \
            --out update.json
          # The manifest decides what every client downloads, so prove the digests describe the
          # bytes that were just built before anything is published.
          for abi in arm64-v8a armeabi-v7a universal; do
            expected=$(python3 -c "import json;print(json.load(open('update.json'))['apkSha256']['$abi'])")
            actual=$(sha256sum "release-apks/moxia-${GITHUB_REF_NAME}-${abi}.apk" | cut -d' ' -f1)
            test "$expected" = "$actual" || { echo "digest mismatch for $abi"; exit 1; }
          done
          echo "manifest digests match the built packages"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Moxia ${{ github.ref_name }}"
          body: |
            **Moxia ${{ github.ref_name }}**

            Commit: ${{ github.sha }}

            | APK | Devices |
            | --- | --- |
            | `arm64-v8a` | 64-bit ARM phones and tablets (recommended) |
            | `armeabi-v7a` | 32-bit ARM devices |
            | `universal` | any device; both ABIs in one APK, larger download |
          # update.json rides along so the release is self-describing even before the mirror is updated.
          files: |
            release-apks/*.apk
            update.json
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Clients read a static file, not an API. Publishing it only after the release exists keeps
      # the manifest from ever pointing at a package that was not uploaded yet.
      - name: Publish update.json to the repository
        run: |
          set -euo pipefail
          cp update.json "$RUNNER_TEMP/update.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B manifest origin/main
          cp "$RUNNER_TEMP/update.json" update.json
          if git diff --quiet -- update.json; then
            echo "manifest already current"
            exit 0
          fi
          git add update.json
          git commit -m "chore(update): publish manifest for ${GITHUB_REF_NAME}"
          git push origin manifest:main

